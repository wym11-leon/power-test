    <style>
        /* --- 全局基础与暗房氛围 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #050505; color: #ececec; 
            font-family: -apple-system, 'PingFang SC', sans-serif; 
            height: 100vh; overflow: hidden; position: relative;
        }
        .page { 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            height: 100%; width: 100%; position: absolute; top: 0; left: 0; 
        }
        .active-page { display: flex; }

        .ambient-light-red {
            position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.15) 0%, rgba(5, 5, 5, 0) 70%); z-index: 1; pointer-events: none;
        }
        .ambient-light-blue {
            position: absolute; bottom: -10%; right: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(25, 25, 112, 0.15) 0%, rgba(5, 5, 5, 0) 70%); z-index: 1; pointer-events: none;
        }

        /* --- 入口页 --- */
        .landing-container { max-width: 420px; padding: 0 30px; z-index: 10; text-align: left; }

        .landing-container h1 span { display: block; font-size: 1.1rem; font-weight: 600; color: #8b0000; letter-spacing: 6px; margin-top: 8px; }
        .description-box { background: rgba(255,255,255,0.02); border-left: 2px solid #8b0000; padding: 16px 20px; margin-bottom: 50px; }
        .description-box p { color: #888; font-size: 0.85rem; line-height: 1.7; letter-spacing: 1px; }
        .start-btn { 
            background: rgba(255,255,255,0.03); color: #ececec; border: 1px solid rgba(255,255,255,0.15); 
            padding: 16px 0; width: 100%; font-size: 0.95rem; cursor: pointer; letter-spacing: 4px; 
            animation: pulse 3s infinite; backdrop-filter: blur(5px); transition: 0.3s;
        }
        .start-btn:hover { background: rgba(139,0,0,0.1); border-color: #8b0000; }
        @keyframes pulse { 0%, 100% { border-color: rgba(255,255,255,0.1); } 50% { border-color: rgba(139,0,0,0.4); } }

        /* --- 答题页 --- */
        .q-container { max-width: 500px; width: 100%; height: 100%; padding: 40px 30px; z-index: 10; display: flex; flex-direction: column; }
        .progress-header { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #666; margin-bottom: 30px; position: relative; }
        
        .back-btn { 
            position: absolute; left: 0; top: -35px; color: #888; font-size: 0.85rem; 
            cursor: pointer; letter-spacing: 1px; display: flex; align-items: center; transition: 0.3s;
        }
        .back-btn:hover { color: #fff; }
        .back-btn.hidden { opacity: 0; pointer-events: none; }

        .progress-bar-container { flex-grow: 1; height: 2px; background: #222; margin: 0 15px; position: relative; }
        .progress-bar-fill { position: absolute; top: 0; left: 0; height: 100%; background: #8b0000; transition: width 0.4s ease; box-shadow: 0 0 8px rgba(139,0,0,0.8); }
        .question-title { font-size: 1.1rem; line-height: 1.6; font-weight: 300; margin-bottom: 25px; flex-shrink: 0; }
        .question-title span { color: #888; font-size: 0.8rem; display: block; margin-bottom: 10px; letter-spacing: 2px; }
        .question-title .multi-tag { color: #8b0000; font-size: 0.75rem; border: 1px solid #8b0000; padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }
        
        .options-wrapper { flex-grow: 1; overflow-y: auto; padding-bottom: 20px; }
        .options-wrapper::-webkit-scrollbar { display: none; }
        .option-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 15px 20px; border-radius: 6px; font-size: 0.9rem; line-height: 1.5; color: #ccc; cursor: pointer; transition: 0.3s; margin-bottom: 12px; }
        .option-card:hover { background: rgba(255,255,255,0.06); }
        .option-card.active { background: rgba(139,0,0,0.1); border-color: #8b0000; color: #fff; transform: translateX(4px); box-shadow: inset 0 0 15px rgba(139,0,0,0.2); }

        .confirm-btn {
            background: linear-gradient(135deg, #8b0000 0%, #4a0000 100%); color: #fff; border: none; padding: 14px 0; width: 100%; font-size: 1rem; border-radius: 4px; cursor: pointer; letter-spacing: 4px; transition: 0.3s; margin-top: 10px; display: none;
        }
        .confirm-btn.show { display: block; animation: fadeIn 0.5s ease; }
        .confirm-btn:active { transform: scale(0.98); }

        /* --- 解析与结果页 --- */
        .loading-text { font-family: 'Courier New', monospace; font-size: 1.2rem; color: #8b0000; letter-spacing: 3px; z-index: 10; text-align: center; }
        .result-container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 30px; z-index: 10; }
        .tag-name { font-size: 2rem; font-weight: 300; color: #fff; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,255,255,0.2); text-align: center; }
        .tag-name span { color: #8b0000; font-weight: 600; }
        .short-desc { font-size: 0.85rem; color: #888; line-height: 1.6; max-width: 320px; text-align: center; }
        #radar-chart { width: 100%; max-width: 400px; height: 350px; margin-top: 10px; }

        .paywall-text span { display: block; font-size: 0.75rem; color: #8b0000; margin-top: 8px; letter-spacing: 4px; }
        .secret-input { width: 280px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 14px; font-size: 1.1rem; text-align: center; font-family: monospace; letter-spacing: 3px; border-radius: 4px; outline: none; margin-bottom: 20px; }
        .secret-input:focus { border-color: #8b0000; background: rgba(139,0,0,0.1); }
    </style>
</head>
<body>
    <div class="ambient-light-red"></div>
    <div class="ambient-light-blue"></div>

    <!-- 1. 入口页 -->
    <div id="page-landing" class="page active-page">

    <!-- 1.5. 邀请码验证页 -->

    <!-- 2. 答题页 -->
    <div id="page-question" class="page">

                <span id="q-tag">SCENE 01</span>
                <div id="q-text">题目加载中...</div>
            </div>

                <button class="confirm-btn" id="btn-confirm" onclick="confirmMultiSelect()">确认选择</button>

            <div class="short-desc" id="final-tag-desc">计算中...</div>
            <div id="radar-chart"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 初始化 Supabase 凭证
        // ==========================================
        const SUPABASE_URL = 'https://cmkigbfwqvdhthbztjas.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_dtYvAIOdBxZgbWID-33tWg_1TIxn4OQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 全局变量，记录当前有效且未使用的邀请码

        // --- 完整 30 题核心题库 ---
        const questions = [

                { text: "C. 表面不在意，私下疯狂调查对方的所有背景。", scores: { "领地意识": 5, "细节敏感": 2 } },

            { type: 'multi', tag: "PART 1 / 极限边界", text: "面对充满未知和变数的异地/跨国恋，你脑海中真实的念头有（多选）：", options: [

                { text: "B. 极度担忧对方的安全，害怕对方独自面对变故。", scores: { "分离焦虑": 4 } },

                { text: "D. 觉得是个完美契机，刚好可以保留独立空间。", scores: { "抽离阈值": 4 } },
                { text: "E. 暗暗计算如果最终没有结果，我付出的成本如何止损。", scores: { "沉没成本": 4 } }

            { type: 'single', tag: "PART 1 / 极限边界", text: "伴侣突然向你坦白一个深藏多年、有些不堪的秘密：", options: [
                { text: "A. 感到负担和害怕，不知道自己能不能承接住。", scores: { "情绪内耗": 5, "托付心态": 2 } },

                { text: "C. 疯狂内耗，怀疑TA此时坦白的目的和隐藏的更多事情。", scores: { "细节敏感": 5, "安全感黑洞": 2 } },
                { text: "D. 理性分析这个秘密是否会影响到我们未来的利益。", scores: { "规则制定": 5, "抽离阈值": 2 } }
            ]},
            { type: 'single', tag: "PART 1 / 极限边界", text: "凌晨三点处于高压疲惫状态，伴侣却因小事无理取闹：", options: [
                { text: "A. 强压疲惫，用技巧和逻辑快速安抚，把控情绪节奏。", scores: { "情绪主导": 5, "狩猎直觉": 2 } },
                { text: "B. 瞬间崩溃，陷入“为什么TA不能体谅我”的痛苦中。", scores: { "情绪内耗": 5, "细节敏感": 2 } },

            ]},
            { type: 'multi', tag: "PART 1 / 极限边界", text: "当对方一再打破你定下的原则底线时，你会（多选）：", options: [
                { text: "A. 冷血执行惩罚机制，做好随时抽身离开的准备。", scores: { "抽离阈值": 4, "规则制定": 2 } },

        let userSelections = new Array(questions.length).fill(null).map(() => []);
        let currentQIndex = 0;

        // --- 核心页面路由 ---
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
        }

        // --- 验证邀请码核心逻辑 ---
        async function verifyKey() {
            const btn = document.getElementById('verify-btn');
            const inputCode = document.getElementById('secret-key').value.trim();

            if (!inputCode) {
                btn.innerText = '请输入邀请码';
                setTimeout(() => { btn.innerText = '验证并进入'; }, 1000);
                return;
            }

            btn.innerText = '云端核验中...'; 
            btn.style.pointerEvents = 'none'; 
            btn.style.background = '#4a0000';

            try {
                // 查询 Supabase 数据库
                const { data, error } = await supabase
                    .from('invites')
                    .select('*')
                    .eq('code', inputCode)
                    .single();

                if (error || !data) {
                    btn.innerText = '邀请码无效或不存在'; 
                    btn.style.background = '#333';
                    setTimeout(() => { 
                        btn.innerText = '验证并进入'; 
                        btn.style.background = 'linear-gradient(135deg, #8b0000 0%, #4a0000 100%)'; 
                        btn.style.pointerEvents = 'auto';
                    }, 1500);
                    return;
                }

                currentInviteCode = inputCode; 

                if (data.is_used) {
                    // 逻辑分支 A：邀请码已使用，直接调取历史数据
                    btn.innerText = '读取历史档案...';
                    setTimeout(() => {
                        let savedData = data.result;
                        if (typeof savedData === 'string') {
                            try { savedData = JSON.parse(savedData); } 
                            catch (e) { console.error("JSON parse error:", e); }
                        }
                        renderSavedResult(savedData);
                        
                        // 恢复按钮状态
                        btn.style.pointerEvents = 'auto';
                        btn.innerText = '验证并进入';
                        btn.style.background = 'linear-gradient(135deg, #8b0000 0%, #4a0000 100%)';
                    }, 1000);
                } else {
                    // 逻辑分支 B：邀请码未使用，进入答题环节
                    btn.innerText = '权限已核准'; 
                    btn.style.background = 'rgba(25,25,112,0.9)';
                    setTimeout(() => {
                        btn.style.pointerEvents = 'auto'; 
                        btn.innerText = '验证并进入';
                        btn.style.background = 'linear-gradient(135deg, #8b0000 0%, #4a0000 100%)'; 
                        document.getElementById('secret-key').value = ''; 
                        startTest(); 
                    }, 1000);
                }
            } catch (err) {
                console.error("Database connection error:", err);
                btn.innerText = '网络连接异常';
                setTimeout(() => {
                    btn.style.pointerEvents = 'auto';
                    btn.innerText = '验证并进入';
                    btn.style.background = 'linear-gradient(135deg, #8b0000 0%, #4a0000 100%)';
                }, 1500);
            }
        }

        function startTest() {
            switchPage('page-question');
            renderQuestion();
        }

        // --- 渲染题目逻辑 ---
        function renderQuestion() {
            if (currentQIndex >= questions.length) {
                finishTest();
                return;
            }
            const q = questions[currentQIndex];
            const isMulti = q.type === 'multi';

            document.getElementById('q-current-num').innerText = String(currentQIndex + 1).padStart(2, '0');
            document.getElementById('q-progress').style.width = ((currentQIndex + 1) / questions.length) * 100 + '%';
            
            let tagHTML = q.tag;
            if(isMulti) tagHTML += '<span class="multi-tag">多选</span>';
            document.getElementById('q-tag').innerHTML = tagHTML;
            document.getElementById('q-text').innerText = q.text;

            const backBtn = document.getElementById('btn-back');
            if(currentQIndex === 0) backBtn.classList.add('hidden');
            else backBtn.classList.remove('hidden');
            
            const optionsBox = document.getElementById('q-options');
            const confirmBtn = document.getElementById('btn-confirm');
            optionsBox.innerHTML = '';
            
            if(isMulti) confirmBtn.classList.add('show');
            else confirmBtn.classList.remove('show');

            let currentAns = userSelections[currentQIndex];

            q.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'option-card';
                if(currentAns.includes(idx)) div.classList.add('active'); 
                div.innerText = opt.text;
                
                div.onclick = function() {
                    if (!isMulti) {
                        Array.from(optionsBox.children).forEach(c => c.classList.remove('active'));
                        this.classList.add('active');
                        userSelections[currentQIndex] = [idx];
                        
                        setTimeout(() => {
                            document.querySelector('.q-container').style.opacity = '0';
                            setTimeout(() => {
                                currentQIndex++; renderQuestion();
                                document.querySelector('.q-container').style.opacity = '1';
                            }, 300);
                        }, 200);
                    } else {
                        this.classList.toggle('active');
                        if (this.classList.contains('active')) {
                            if (!currentAns.includes(idx)) currentAns.push(idx);
                        } else {
                            currentAns = currentAns.filter(i => i !== idx);
                        }
                        userSelections[currentQIndex] = currentAns;
                    }
                };
                optionsBox.appendChild(div);
            });
        }

        function confirmMultiSelect() {
            if(userSelections[currentQIndex].length === 0) return; 
            document.querySelector('.q-container').style.opacity = '0';
            setTimeout(() => {
                currentQIndex++; renderQuestion();
                document.querySelector('.q-container').style.opacity = '1';
            }, 300);
        }

        function goBack() {
            if (currentQIndex > 0) {
                document.querySelector('.q-container').style.opacity = '0';
                setTimeout(() => {
                    currentQIndex--; renderQuestion();
                    document.querySelector('.q-container').style.opacity = '1';
                }, 300);
            }
        }

        function finishTest() {
            switchPage('page-loading');
            let count = 0;
            const txt = document.getElementById('loading-txt');
            const phrases = ["ANALYZING EMOTIONS...", "MAPPING TOPOLOGY...", "GENERATING REPORT..."];
            const interval = setInterval(() => {
                txt.innerText = phrases[count % 3]; count++;
                if(count > 4) { clearInterval(interval); generateResult(); }
            }, 600);
        }

        // --- 生成、上传并保存结果 ---
        async function generateResult() {
            let dimensions = { "领地意识": 0, "情绪主导": 0, "边界入侵": 0, "抽离阈值": 0, "魅力伪装": 0, "狩猎直觉": 0, "规则制定": 0, "分离焦虑": 0, "情绪内耗": 0, "底线退让": 0, "安全感黑洞": 0, "沉没成本": 0, "细节敏感": 0, "托付心态": 0 };
            
            for(let i=0; i<questions.length; i++) {
                let ansArray = userSelections[i];
                ansArray.forEach(optIdx => {
                    let scores = questions[i].options[optIdx].scores;
                    for(let key in scores) { dimensions[key] += scores[key] * 1.5; } 
                });
            }

            let hunter = dimensions["领地意识"] + dimensions["情绪主导"] + dimensions["边界入侵"] + dimensions["抽离阈值"] + dimensions["魅力伪装"] + dimensions["狩猎直觉"] + dimensions["规则制定"];
            let prey = dimensions["分离焦虑"] + dimensions["情绪内耗"] + dimensions["底线退让"] + dimensions["安全感黑洞"] + dimensions["沉没成本"] + dimensions["细节敏感"] + dimensions["托付心态"];
            
            let tag = "清醒的<span>旁观者</span>";
            let desc = "既不想征服谁，也懒得依附谁。你有着极致的防御壁垒，保护了自己免受伤害，但也挡住了所有惊喜。";
            
            if(hunter > prey * 1.2 && dimensions["抽离阈值"] > 15) { 
                tag = "冷血的<span>赏金猎人</span>"; 
                desc = "你在亲密关系里像个没有感情的KPI杀手。比起被爱，你更享受降服的快感。顶级猎手，绝不回头。"; 
            } else if(prey > hunter * 1.2 && dimensions["情绪内耗"] > 15) { 
                tag = "纯白<span>献祭者</span>"; 
                desc = "一谈恋爱智商清零。你以为毫无保留的付出能换来偏爱，其实只换来了对方的有恃无恐。"; 
            } else if(hunter > 40 && prey > 40) { 
                tag = "伪装成猎手的<span>重度依赖症</span>"; 
                desc = "你表面是无坚不摧的控场王，但一旦拉开距离，内心的不安全感就会疯狂滋长，用傲慢掩饰分离焦虑。"; 
            } else if(dimensions["魅力伪装"] > 15 && dimensions["安全感黑洞"] > 15) {
                tag = "易碎的<span>完美情人</span>";
                desc = "光芒万丈极具吸引力，在感情里却总是卑微地自我怀疑。美丽掩盖不住渴求被偏爱的灵魂。";
            } else if(dimensions["边界入侵"] > 15 && dimensions["沉没成本"] > 15) {
                tag = "拉扯上瘾的<span>赌徒</span>";
                desc = "平淡安稳让你觉得索然无味，你需要忽冷忽热的试探。爱的不仅是人，更是失控边缘游走的刺激感。";
            }

            const resultDataToSave = {
                dimensions: dimensions,
                tag: tag,
                desc: desc
            };

            // 如果是通过有效邀请码进来的，则上传结果并标记为已使用
            if (currentInviteCode) {
                try {
                    await supabase
                        .from('invites')
                        .update({ 
                            is_used: true, 
                            result: JSON.stringify(resultDataToSave) 
                        })
                        .eq('code', currentInviteCode);
                } catch (err) {
                    console.error("数据上传失败:", err);
                }
            }

            renderSavedResult(resultDataToSave);
        }

        // --- 渲染雷达图与结果视图 ---
        function renderSavedResult(data) {
            switchPage('page-result');
            
            document.getElementById('final-tag-title').innerHTML = data.tag;
            document.getElementById('final-tag-desc').innerText = data.desc;

            const chart = echarts.init(document.getElementById('radar-chart'));
            chart.setOption({
                radar: {
                    indicator: Object.keys(data.dimensions).map(k => ({name: k, max: 45})),
                    shape: 'polygon', splitNumber: 4,
                    axisName: { color: '#888', fontSize: 10 },
                    splitLine: { lineStyle: { color: ['rgba(255,255,255,0.05)', 'rgba(255,255,255,0.1)', 'rgba(255,255,255,0.15)', 'rgba(255,255,255,0.2)'].reverse() } },
                    splitArea: { show: false }, axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                },
                series: [{
                    type: 'radar',
                    data: [{
                        value: Object.values(data.dimensions), name: '测试结果',
                        itemStyle: { color: '#8b0000' }, lineStyle: { color: 'rgba(139,0,0,0.8)' },
                        areaStyle: { color: new echarts.graphic.RadialGradient(0.5, 0.5, 1, [{ color: 'rgba(139,0,0,0.4)', offset: 0 }, { color: 'rgba(25,25,112,0.4)', offset: 1 }]) }
                    }]
                }]
            });
        }
    </script>
